# AdOps360 — containerised monolith on a single EC2 instance.
# Four services: backend, frontend, db, nginx.
# Microsoft Entra ID and S3 are managed services and are not part of this stack;
# only the configuration needed to reach them is declared here.
#
# Configuration comes from .env (copied from .env.example, never committed).
# Compose also reads .env for the ${...} interpolation below.

# The project is adops360 whatever the folder is called. COMPOSE_PROJECT_NAME (in the environment or in .env) and -p
# take precedence: each worktree sets its own so it does not share containers or the database with another folder.
name: adops360

services:
  db:
    image: postgres:16
    restart: unless-stopped
    env_file: .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - adops360

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    # Database, S3 and DSP credentials. Only the backend needs the secrets.
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      # Entra is the one real issuer: Compose refuses to start without both, and so does the backend.
      ENTRA_TENANT_ID: "${ENTRA_TENANT_ID:?ENTRA_TENANT_ID is required, set it in .env}"
      ENTRA_CLIENT_ID: "${ENTRA_CLIENT_ID:?ENTRA_CLIENT_ID is required, set it in .env}"
      # The test issuer, for the end-to-end tests and API calls in development. environment: takes
      # precedence over env_file, so .env cannot change them. The key pair comes from scripts/generate_test_issuer_keys.sh.
      APP_ENV: development
      TEST_ISSUER_PUBLIC_KEY_FILE: /run/test-issuer/public.pem
    # Only the public half, read-only; the private directory is mounted into no service.
    volumes:
      - ./.secrets/test-issuer/public:/run/test-issuer:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - adops360

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Public settings, inlined into the browser bundle at build time.
        # No env_file here on purpose: the DSP credentials must not reach this container.
        # The browser signs in with Entra: the same tenant and client the backend reads, required by the build.
        # Never version real values.
        NEXT_PUBLIC_ENTRA_TENANT_ID: "${ENTRA_TENANT_ID:?ENTRA_TENANT_ID is required, set it in .env}"
        NEXT_PUBLIC_ENTRA_CLIENT_ID: "${ENTRA_CLIENT_ID:?ENTRA_CLIENT_ID is required, set it in .env}"
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        # "true" blurs every Adform campaign and line name (screenshots, demos). Empty shows them.
        NEXT_PUBLIC_MASK_NAMES: ${NEXT_PUBLIC_MASK_NAMES:-}
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - adops360

  nginx:
    image: nginx:1.27
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - certbot_certs:/etc/letsencrypt:ro
      - certbot_webroot:/var/www/certbot:ro
    networks:
      - adops360

  # TLS certificate issuance and renewal.
  # Run on demand: docker compose run --rm certbot renew
  certbot:
    image: certbot/certbot:latest
    volumes:
      - certbot_certs:/etc/letsencrypt
      - certbot_webroot:/var/www/certbot
    profiles:
      - tls

volumes:
  postgres_data:
  certbot_certs:
  certbot_webroot:

networks:
  adops360:
    driver: bridge
