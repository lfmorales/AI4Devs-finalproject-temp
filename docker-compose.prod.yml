# AdOps360 — production composition for a single EC2 instance. A complete file, not an override.
#
#   docker compose -f docker-compose.prod.yml up -d
#
# Configuration comes from .env (never committed, chmod 600 on the instance); see docs/deploy.md.
# Required in .env besides the usual variables: SERVER_NAME (the public host name, no scheme) and
# NEXT_PUBLIC_API_URL (https://<SERVER_NAME>/api). Only nginx publishes ports.
# ENV_FILE, HTTP_PORT and HTTPS_PORT exist so scripts/verify_prod_images.sh can run beside a development
# stack with throwaway settings; leave them unset in production.

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  db:
    image: postgres:16
    restart: unless-stopped
    env_file: ${ENV_FILE:-.env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging
    networks:
      - adops360

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: ${ENV_FILE:-.env}
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging
    networks:
      - adops360

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Public settings, inlined into the browser bundle at build time. No env_file on purpose:
        # the DSP credentials must not reach this container.
        NEXT_PUBLIC_COGNITO_REGION: ${COGNITO_REGION}
        NEXT_PUBLIC_COGNITO_USER_POOL_ID: ${COGNITO_USER_POOL_ID}
        NEXT_PUBLIC_COGNITO_CLIENT_ID: ${COGNITO_CLIENT_ID}
        NEXT_PUBLIC_COGNITO_DOMAIN: ${COGNITO_DOMAIN}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    restart: unless-stopped
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/"]
      interval: 15s
      timeout: 5s
      retries: 5
    logging: *default-logging
    networks:
      - adops360

  nginx:
    image: nginx:1.27
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    environment:
      SERVER_NAME: ${SERVER_NAME}
      # Render only ${SERVER_NAME}; the nginx variables ($host, $scheme...) stay as they are.
      NGINX_ENVSUBST_FILTER: SERVER_NAME
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/prod/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - certbot_certs:/etc/letsencrypt:ro
      - certbot_webroot:/var/www/certbot:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsk https://localhost/api/health > /dev/null"]
      interval: 15s
      timeout: 5s
      retries: 5
    logging: *default-logging
    networks:
      - adops360

  # Certificate issuance and renewal, run on demand (docs/deploy.md).
  certbot:
    image: certbot/certbot:latest
    volumes:
      - certbot_certs:/etc/letsencrypt
      - certbot_webroot:/var/www/certbot
    profiles:
      - tls
    logging: *default-logging

volumes:
  postgres_data:
  certbot_certs:
  certbot_webroot:

networks:
  adops360:
    driver: bridge
